name: CI/CD - Dev

on:
  pull_request:
    branches:
      - dev
    types:
      - closed

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true

    steps:
      - name: Baixar branch dev
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar build
        run: npm run build

      - name: Comitar pasta dist na branch dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f dist

          if git diff --cached --quiet; then
            echo "Nenhuma alteração na pasta dist."
          else
            git commit -m "build: atualizar pasta dist [skip ci]"
            git push origin dev
          fi

  deploy:
    name: Deploy em desenvolvimento
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Atualizar projeto no servidor
        uses: appleboy/ssh-action@v1
        with:
          host: 192.169.82.226
          username: devstopados
          password: ${{ secrets.TASKFLOW }}
          port: 1243
          script: |
            set -e

            cd ~/public_html/taskflow/frontend/dev

            git fetch origin
            git checkout dev
            git pull origin dev

            echo "Deploy realizado com sucesso."